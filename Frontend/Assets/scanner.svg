<svg viewBox="0 0 100 100">
    <!-- Outer Ring -->
    <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="4"/>

    <!-- Signal / Wi-Fi Waves -->
    <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
        <!-- Inner Dot -->
        <circle cx="50" cy="46" r="1" fill="currentColor"/>
        <!-- Waves -->
        <path d="M 43,39 A 10,10 0 0,1 57,39"/>
        <path d="M 37,33 A 18,18 0 0,1 63,33"/>
        <path d="M 31,27 A 26,26 0 0,1 69,27"/>
    </g>

    <!-- NFC Text -->
    <text x="50" y="72" fill="currentColor" font-family="Arial, sans-serif" font-weight="bold" font-size="14"
          text-anchor="middle">NFC
    </text>
</svg>
