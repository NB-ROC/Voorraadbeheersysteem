syntax = "proto3";
import "user.proto";

option csharp_namespace = "Protos.Auth";

package auth;

service Auth {
  rpc Login (AuthLoginRequest) returns (AuthLoginResponse);
}

// Login
message AuthLoginRequest {
  string email = 1;
  string password = 2;
}

message AuthLoginResponse {
  optional string token = 1;
  optional user.MetaUser user = 2;
}
